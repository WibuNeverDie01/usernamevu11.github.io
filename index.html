

    <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ôn Tập Trắc Nghiệm GDĐP 10 - GK I</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success-bg: #dcfce7;
      --success-border: #16a34a;
      --success-text: #166534;
      --danger-bg: #fee2e2;
      --danger-border: #dc2626;
      --danger-text: #991b1b;
      --warn-bg: #fef9c3;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 12px 32px;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);
      margin-bottom: 14px;
    }

    header h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      line-height: 1.3;
    }

    header p {
      margin: 0;
      opacity: 0.92;
      font-size: 0.88rem;
    }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      align-items: end;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
    }

    select, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 10px;
    }

    select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      width: 100%;
    }

    .checkbox-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
    }

    .checkbox-stack label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    .checkbox-stack input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 11px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
    }

    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; flex: 1; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: var(--text); flex: 1; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }

    /* Result banner (hiển thị đẹp trên cả PC & Mobile) */
    .result-box {
      display: none;
      background: #fff;
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.12);
    }

    .result-box.show { display: block; }
    .score-big {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin: 4px 0;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 18px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 14px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .badge {
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .nav-item {
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text);
    }

    .nav-item.answered { background: #dbeafe; border-color: #60a5fa; color: #1e3a8a; }
    .nav-item.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .nav-item.wrong { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }

    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      scroll-margin-top: 16px;
    }

    .q-title {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .q-num {
      color: var(--primary);
      margin-right: 4px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      min-height: 46px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: 0.12s ease;
      background: #fff;
      font-size: 0.96rem;
    }

    .opt-label input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      accent-color: var(--primary);
    }

    .opt-label.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .opt-label.correct-opt {
      border-color: var(--success-border);
      background: var(--success-bg);
      color: var(--success-text);
      font-weight: 600;
    }

    .opt-label.wrong-opt {
      border-color: var(--danger-border);
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .q-feedback {
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }

    .q-feedback.show { display: block; }
    .q-feedback.ok { background: var(--success-bg); color: var(--success-text); }
    .q-feedback.err { background: var(--danger-bg); color: var(--danger-text); }
    .q-feedback.warn { background: var(--warn-bg); color: #854d0e; }

    .end-submit-wrap {
      margin-top: 16px;
      display: none;
    }

    /* Thanh cố định nhỏ gọn ở đáy màn hình dành riêng cho điện thoại */
    .mobile-bottom-bar {
      display: none;
    }

    /* Modal chung (Xác nhận nộp bài & Bảng câu hỏi trên điện thoại) */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 420px;
      max-height: 82vh;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .modal-close {
      background: #f1f5f9;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .modal-grid-scroll {
      overflow-y: auto;
      padding: 4px 0;
    }

    /* Giao diện Điện thoại / Màn hình nhỏ */
    @media (max-width: 900px) {
      .container {
        padding: 12px 10px 88px; /* Chừa khoảng trống cho thanh dưới cùng */
      }

      .layout {
        grid-template-columns: 1fr;
      }

      /* Ẩn hoàn toàn sidebar lớn trên điện thoại để KHÔNG che màn hình */
      .sidebar {
        display: none;
      }

      .end-submit-wrap {
        display: flex;
        gap: 10px;
      }

      .mobile-bottom-bar {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 62px;
        background: #ffffff;
        border-top: 1px solid var(--border);
        box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.08);
        padding: 8px 12px;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        z-index: 900;
      }

      .mob-pill {
        background: #f1f5f9;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 12px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        font-size: 0.88rem;
        color: var(--text);
        cursor: pointer;
      }

      .mob-timer {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
        white-space: nowrap;
      }

      .mob-submit {
        height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        border: none;
        background: #16a34a;
        color: #fff;
        font-weight: 700;
        font-size: 0.92rem;
        cursor: pointer;
        flex: 1;
        max-width: 170px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ÔN TẬP TRẮC NGHIỆM GDĐP 10 – GIỮA KÌ I</h1>
      <p>40 câu hỏi • Nhiều mã đề • Xáo trộn tự động • Hoạt động mượt trên điện thoại</p>
    </header>

    <div class="toolbar">
      <div class="control-group">
        <label for="examCode">Chọn Mã Đề</label>
        <select id="examCode">
          <option value="000">Mã đề gốc (000 - Không xáo)</option>
          <option value="101" selected>Mã đề 101</option>
          <option value="102">Mã đề 102</option>
          <option value="103">Mã đề 103</option>
          <option value="104">Mã đề 104</option>
          <option value="105">Mã đề 105</option>
          <option value="random">Mã đề ngẫu nhiên mới</option>
        </select>
      </div>

      <div class="control-group">
        <label for="quizMode">Chế độ làm bài</label>
        <select id="quizMode">
          <option value="exam">Thi thử (Nộp bài mới chấm điểm)</option>
          <option value="practice">Ôn tập (Chọn xong hiện đáp án ngay)</option>
        </select>
      </div>

      <div class="checkbox-stack">
        <label><input type="checkbox" id="shuffleQuestions" checked /> Xáo trộn thứ tự câu hỏi</label>
        <label><input type="checkbox" id="shuffleOptions" checked /> Xáo trộn đáp án (A, B, C, D)</label>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="generateNewRandomCode()">🎲 Đổi mã đề</button>
        <button class="btn btn-secondary" onclick="resetCurrentExam()">🔄 Làm lại</button>
      </div>
    </div>

    <!-- Hộp hiển thị điểm (nằm gọn phía trên danh sách câu hỏi sau khi nộp) -->
    <div id="resultBox" class="result-box">
      <div style="font-size:0.88rem;font-weight:700;color:#64748b;">KẾT QUẢ BÀI LÀM (<span id="resCodeText">Mã đề 101</span>)</div>
      <div class="score-big" id="scoreText">0.0 / 10</div>
      <div id="detailText" style="font-size:0.95rem;font-weight:600;color:#334155;margin-bottom:10px;"></div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-secondary" style="max-width:180px;" onclick="resetCurrentExam()">🔄 Làm lại đề này</button>
        <button class="btn btn-primary" style="max-width:180px;" onclick="generateNewRandomCode()">🎲 Đổi mã đề mới</button>
      </div>
    </div>

    <div class="layout">
      <div>
        <main id="questionsContainer" class="questions-list"></main>

        <!-- Nút nộp bài ngay cuối danh sách câu hỏi trên điện thoại -->
        <div class="end-submit-wrap">
          <button id="endSubmitBtn" class="btn btn-success" style="flex:1;" onclick="requestSubmit()">✅ Nộp bài & Chấm điểm</button>
          <button class="btn btn-secondary" onclick="resetCurrentExam()">🔄 Làm lại</button>
        </div>
      </div>

      <!-- Sidebar chỉ hiển thị trên máy tính -->
      <aside class="sidebar">
        <div class="stats-bar">
          <span id="currentCodeLabel" class="badge">Mã đề: 101</span>
          <span id="timerLabel">⏱ 00:00</span>
        </div>

        <div style="font-size:0.85rem;font-weight:600;color:#64748b;margin-bottom:8px;">
          Bảng câu hỏi (<span id="answeredCount">0</span>/40)
        </div>
        <div id="navGridDesktop" class="nav-grid"></div>

        <div class="btn-row" style="flex-direction:column;">
          <button id="submitBtnDesktop" class="btn btn-success" onclick="requestSubmit()">✅ Nộp bài & Chấm điểm</button>
          <button class="btn btn-secondary" onclick="resetCurrentExam()">🔄 Làm lại từ đầu</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Thanh điều khiển nhỏ gọn dưới đáy cho điện thoại -->
  <div class="mobile-bottom-bar">
    <button class="mob-pill" onclick="openNavModal()">
      📋 <span id="mobCodeShort">101</span> • <span id="mobAnsweredCount">0</span>/40
    </button>
    <span id="mobTimerLabel" class="mob-timer">⏱ 00:00</span>
    <button id="mobSubmitBtn" class="mob-submit" onclick="handleMobileMainAction()">✅ Nộp bài</button>
  </div>

  <!-- Modal Bảng 40 câu hỏi trên điện thoại -->
  <div id="navModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'navModal')">
    <div class="modal-box">
      <div class="modal-header">
        <span>Chọn nhanh câu hỏi (<span id="modalAnsweredCount">0</span>/40)</span>
        <button class="modal-close" onclick="closeModal('navModal')">✕</button>
      </div>
      <div class="modal-grid-scroll">
        <div id="navGridMobile" class="nav-grid"></div>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <button id="modalSubmitBtn" class="btn btn-success" style="flex:1;" onclick="closeModal('navModal'); requestSubmit();">✅ Nộp bài ngay</button>
        <button class="btn btn-secondary" onclick="closeModal('navModal')">Đóng</button>
      </div>
    </div>
  </div>

  <!-- Modal Xác nhận nộp bài (thay cho confirm() hay bị lỗi trên ĐT) -->
  <div id="confirmModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'confirmModal')">
    <div class="modal-box" style="max-width:360px;">
      <div class="modal-header">
        <span>Xác nhận nộp bài</span>
        <button class="modal-close" onclick="closeModal('confirmModal')">✕</button>
      </div>
      <p id="confirmMessage" style="margin:0 0 16px;color:#334155;font-size:0.96rem;"></p>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeModal('confirmModal')">Làm tiếp</button>
        <button class="btn btn-success" style="flex:1;" onclick="finalizeSubmit()">Nộp bài luôn</button>
      </div>
    </div>
  </div>

  <script>
    const RAW_QUESTIONS = [
      { id: 1, q: "Thành phố Đà Nẵng thuộc vùng kinh tế - xã hội nào của Việt Nam?", opts: ["Bắc Trung Bộ.", "Tây Nguyên.", "Đông Nam Bộ.", "Duyên hải Nam Trung Bộ."], ans: 3 },
      { id: 2, q: "Thành phố Đà Nẵng tiếp giáp với tỉnh/thành nào phía Bắc?", opts: ["Huế.", "Quảng Ngãi.", "Quảng Trị.", "Sê kông (Lào)."], ans: 0 },
      { id: 3, q: "Di sản văn hóa thế giới nào sau đây nằm trên địa bàn tỉnh Quảng Nam (cũ)?", opts: ["Cố đô Huế.", "Thánh địa Mỹ Sơn.", "Phong Nha - Kẻ Bàng.", "Thành nhà Hồ."], ans: 1 },
      { id: 4, q: "Lễ hội Cầu Ngư ở Đà Nẵng gắn liền với tín ngưỡng thờ loài vật nào?", opts: ["Cá Chép.", "Cá Voi (Cá Ông).", "Rùa biển.", "Rồng."], ans: 1 },
      { id: 5, q: "Làng nghề đá mỹ nghệ Non Nước nằm ở phường nào của thành phố Đà Nẵng?", opts: ["Sơn Trà.", "Hải Châu.", "Ngũ Hành Sơn.", "Liên Chiểu."], ans: 2 },
      { id: 6, q: "Loại hình nghệ thuật dân gian nào của Quảng Nam (cũ) đã được UNESCO ghi danh là di sản văn hóa phi vật thể?", opts: ["Hát Xoan.", "Nghệ thuật Bài Chòi.", "Đờn ca tài tử.", "Nhã nhạc cung đình."], ans: 1 },
      { id: 7, q: "Huyện đảo nào sau đây trực thuộc thành phố Đà Nẵng?", opts: ["Trường Sa.", "Cồn Cỏ.", "Lý Sơn.", "Hoàng Sa."], ans: 3 },
      { id: 8, q: "Di sản văn hóa thế giới nào sau đây thuộc địa phận tỉnh Quảng Nam (cũ)?", opts: ["Cố Đô Huế.", "Nhã Nhạc Cung Đình.", "Thánh Địa Mỹ Sơn.", "Vườn quốc gia Phong Nha - Kẻ Bàng."], ans: 2 },
      { id: 9, q: "Tôn giáo nào du nhập vào Hội An từ rất sớm thông qua các thương nhân và giáo sĩ phương Tây?", opts: ["Phật giáo.", "Hồi giáo.", "Kitô giáo (Công giáo).", "Cao Đài."], ans: 2 },
      { id: 10, q: "Sông Thu Bồn chảy qua chủ yếu địa phận tỉnh/thành nào?", opts: ["Quảng Ngãi.", "Quảng Trị.", "Thừa Thiên Huế.", "Đà Nẵng."], ans: 3 },
      { id: 11, q: "Địa hình chủ yếu của tỉnh Quảng Nam (cũ) có đặc điểm gì?", opts: ["Bằng phẳng, chủ yếu là đồng bằng.", "Thấp dần từ Tây sang Đông, có nhiều núi cao.", "Cao ở phía Đông, thấp dần về phía Tây.", "Chỉ bao gồm vùng ven biển và hải đảo."], ans: 1 },
      { id: 12, q: "Lễ hội Quán Thế Âm (Ngũ Hành Sơn - Đà Nẵng) thường được tổ chức vào thời gian nào?", opts: ["19/2 Âm lịch.", "19/2 Dương lịch.", "Rằm tháng Giêng.", "Rằm tháng Bảy."], ans: 0 },
      { id: 13, q: "Tín ngưỡng thờ Cá Ông (Cá Voi) phổ biến ở cư dân vùng nào của Đà Nẵng?", opts: ["Cư dân vùng ven biển.", "Cư dân vùng núi cao.", "Cư dân vùng trung du.", "Cư dân sống ở đô thị mới."], ans: 0 },
      { id: 14, q: "Vị trí địa lý của Đà Nẵng có vai trò như thế nào trong Hành lang kinh tế Đông - Tây (EWEC)?", opts: ["Là cửa ngõ ra biển Đông quan trọng của hành lang.", "Là trung tâm nông nghiệp lớn nhất hành lang.", "Là điểm đầu phía Tây của hành lang.", "Là khu vực duy nhất có cảng biển nước sâu."], ans: 0 },
      { id: 15, q: "Đặc điểm nổi bật trong kiến trúc nhà cổ Hội An phản ánh sự giao thoa văn hóa giữa Việt Nam và các quốc gia nào?", opts: ["Ấn Độ và Thái Lan.", "Pháp và Mỹ.", "Trung Hoa và Nhật Bản.", "Lào và Campuchia."], ans: 2 },

    const LETTERS = ["A", "B", "C", "D"];
    let currentExam = [];
    let userAnswers = {};
    let isSubmitted = false;
    let currentSeedCode = "101";
    let timerSeconds = 0;
    let timerInterval = null;

    function createPRNG(seedStr) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < seedStr.length; i++) {
        h ^= seedStr.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return function () {
        h += 0x6D2B79F5;
        let t = Math.imul(h ^ (h >>> 15), 1 | h);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function shuffleArray(arr, rand) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildExam() {
      const codeSelect = document.getElementById("examCode").value;
      const doShuffleQ = document.getElementById("shuffleQuestions").checked;
      const doShuffleO = document.getElementById("shuffleOptions").checked;

      if (codeSelect === "000") {
        currentSeedCode = "000";
      } else if (codeSelect === "random") {
        currentSeedCode = String(Math.floor(106 + Math.random() * 890));
      } else {
        currentSeedCode = codeSelect;
      }

      const rand = createPRNG("GDDP10_" + currentSeedCode);

      let prepared = RAW_QUESTIONS.map((item) => {
        const mappedOpts = item.opts.map((text, idx) => ({
          text,
          isCorrect: idx === item.ans
        }));

        const finalOpts =
          currentSeedCode !== "000" && doShuffleO && !item.isTrueFalse
            ? shuffleArray(mappedOpts, rand)
            : mappedOpts;

        return { ...item, shuffledOpts: finalOpts };
      });

      if (currentSeedCode !== "000" && doShuffleQ) {
        prepared = shuffleArray(prepared, rand);
      }

      currentExam = prepared;
      resetStateUI();
      startTimer();
      renderExam();
    }

    function resetStateUI() {
      userAnswers = {};
      isSubmitted = false;
      closeModal("navModal");
      closeModal("confirmModal");

      document.getElementById("currentCodeLabel").textContent = "Mã đề: " + currentSeedCode;
      document.getElementById("mobCodeShort").textContent = "Đề " + currentSeedCode;
      document.getElementById("resCodeText").textContent = "Mã đề " + currentSeedCode;
      document.getElementById("resultBox").classList.remove("show");

      document.getElementById("submitBtnDesktop").disabled = false;
      document.getElementById("endSubmitBtn").disabled = false;
      document.getElementById("mobSubmitBtn").textContent = "✅ Nộp bài";
      document.getElementById("mobSubmitBtn").style.background = "#16a34a";
      document.getElementById("modalSubmitBtn").style.display = "inline-flex";
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerSeconds = 0;
      updateTimerUI();
      timerInterval = setInterval(() => {
        if (!isSubmitted) {
          timerSeconds++;
          updateTimerUI();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, "0");
      const s = String(timerSeconds % 60).padStart(2, "0");
      const text = `⏱ ${m}:${s}`;
      document.getElementById("timerLabel").textContent = text;
      document.getElementById("mobTimerLabel").textContent = text;
    }

    function renderExam() {
      const container = document.getElementById("questionsContainer");
      const navDesktop = document.getElementById("navGridDesktop");
      const navMobile = document.getElementById("navGridMobile");
      container.innerHTML = "";
      navDesktop.innerHTML = "";
      navMobile.innerHTML = "";

      currentExam.forEach((qItem, qIndex) => {
        const card = document.createElement("div");
        card.className = "q-card";
        card.id = `q-card-${qIndex}`;

        const title = document.createElement("div");
        title.className = "q-title";
        title.innerHTML = `<span class="q-num">Câu ${qIndex + 1}:</span> ${qItem.q}`;
        card.appendChild(title);

        const optsWrap = document.createElement("div");
        optsWrap.className = "options";

        qItem.shuffledOpts.forEach((opt, optIdx) => {
          const label = document.createElement("label");
          label.className = "opt-label";
          label.id = `opt-${qIndex}-${optIdx}`;

          const input = document.createElement("input");
          input.type = "radio";
          input.name = `question_${qIndex}`;
          input.value = optIdx;
          input.onchange = () => selectOption(qIndex, optIdx);

          const span = document.createElement("span");
          span.innerHTML = `<strong>${LETTERS[optIdx]}.</strong> ${opt.text}`;

          label.appendChild(input);
          label.appendChild(span);
          optsWrap.appendChild(label);
        });

        const feedback = document.createElement("div");
        feedback.className = "q-feedback";
        feedback.id = `feedback-${qIndex}`;

        card.appendChild(optsWrap);
        card.appendChild(feedback);
        container.appendChild(card);

        // Nút bảng câu hỏi cho Desktop và Mobile
        [navDesktop, navMobile].forEach((grid, gIdx) => {
          const navBtn = document.createElement("button");
          navBtn.className = "nav-item";
          navBtn.id = `nav-${gIdx}-${qIndex}`;
          navBtn.textContent = qIndex + 1;
          navBtn.onclick = () => {
            closeModal("navModal");
            setTimeout(() => {
              document.getElementById(`q-card-${qIndex}`).scrollIntoView({ behavior: "smooth", block: "start" });
            }, 60);
          };
          grid.appendChild(navBtn);
        });
      });

      updateAnsweredCount();
    }

    function selectOption(qIndex, optIdx) {
      const mode = document.getElementById("quizMode").value;
      if (isSubmitted) return;

      userAnswers[qIndex] = optIdx;

      const totalOpts = currentExam[qIndex].shuffledOpts.length;
      for (let i = 0; i < totalOpts; i++) {
        const el = document.getElementById(`opt-${qIndex}-${i}`);
        el.classList.remove("selected", "correct-opt", "wrong-opt");
        if (i === optIdx) el.classList.add("selected");
      }

      [0, 1].forEach((gIdx) => {
        document.getElementById(`nav-${gIdx}-${qIndex}`).classList.add("answered");
      });

      if (mode === "practice") {
        evaluateSingleQuestion(qIndex);
      }

      updateAnsweredCount();
    }

    function evaluateSingleQuestion(qIndex) {
      const qItem = currentExam[qIndex];
      const chosen = userAnswers[qIndex];
      const correctIdx = qItem.shuffledOpts.findIndex((o) => o.isCorrect);
      const fb = document.getElementById(`feedback-${qIndex}`);

      qItem.shuffledOpts.forEach((_, idx) => {
        const el = document.getElementById(`opt-${qIndex}-${idx}`);
        el.classList.remove("selected", "correct-opt", "wrong-opt");
        if (idx === correctIdx) el.classList.add("correct-opt");
        if (chosen !== undefined && idx === chosen && chosen !== correctIdx) {
          el.classList.add("wrong-opt");
        }
      });

      fb.classList.remove("ok", "err", "warn");
      fb.classList.add("show");

      [0, 1].forEach((gIdx) => {
        const navBtn = document.getElementById(`nav-${gIdx}-${qIndex}`);
        navBtn.classList.remove("answered", "correct", "wrong");
        if (chosen !== undefined) {
          navBtn.classList.add(chosen === correctIdx ? "correct" : "wrong");
        }
      });

      if (chosen === undefined) {
        fb.classList.add("warn");
        fb.textContent = `Chưa trả lời • Đáp án đúng là ${LETTERS[correctIdx]}.`;
      } else if (chosen === correctIdx) {
        fb.classList.add("ok");
        fb.textContent = `✓ Chính xác!`;
      } else {
        fb.classList.add("err");
        fb.textContent = `✗ Sai rồi • Đáp án đúng là ${LETTERS[correctIdx]}.`;
      }
    }

    function updateAnsweredCount() {
      const count = Object.keys(userAnswers).length;
      document.getElementById("answeredCount").textContent = count;
      document.getElementById("mobAnsweredCount").textContent = count;
      document.getElementById("modalAnsweredCount").textContent = count;
    }

    // Xử lý bấm Nộp bài (không dùng confirm() của trình duyệt để tránh lỗi trên ĐT)
    function requestSubmit() {
      if (isSubmitted) return;
      const answeredCount = Object.keys(userAnswers).length;
      if (answeredCount < currentExam.length) {
        document.getElementById("confirmMessage").textContent =
          `Bạn mới trả lời ${answeredCount}/${currentExam.length} câu. Bạn có muốn nộp bài và chấm điểm luôn không?`;
        openModal("confirmModal");
      } else {
        finalizeSubmit();
      }
    }

    function finalizeSubmit() {
      closeModal("confirmModal");
      if (isSubmitted) return;

      isSubmitted = true;
      clearInterval(timerInterval);

      let correctCount = 0;
      currentExam.forEach((qItem, qIndex) => {
        const correctIdx = qItem.shuffledOpts.findIndex((o) => o.isCorrect);
        if (userAnswers[qIndex] === correctIdx) correctCount++;
        evaluateSingleQuestion(qIndex);

        document.querySelectorAll(`input[name="question_${qIndex}"]`).forEach((inp) => {
          inp.disabled = true;
        });
      });

      const score10 = ((correctCount / currentExam.length) * 10).toFixed(2);
      document.getElementById("scoreText").textContent = `${score10} / 10`;
      document.getElementById("detailText").textContent = `Đúng ${correctCount} / ${currentExam.length} câu`;
      document.getElementById("resultBox").classList.add("show");

      document.getElementById("submitBtnDesktop").disabled = true;
      document.getElementById("endSubmitBtn").disabled = true;
      document.getElementById("modalSubmitBtn").style.display = "none";

      // Đổi nút dưới đáy ĐT thành nút Làm lại cho tiện
      const mobBtn = document.getElementById("mobSubmitBtn");
      mobBtn.textContent = "🔄 Làm lại";
      mobBtn.style.background = "#2563eb";

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function handleMobileMainAction() {
      if (isSubmitted) {
        resetCurrentExam();
      } else {
        requestSubmit();
      }
    }

    function resetCurrentExam() {
      resetStateUI();
      startTimer();
      renderExam();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function generateNewRandomCode() {
      document.getElementById("examCode").value = "random";
      buildExam();
    }

    function openNavModal() { openModal("navModal"); }
    function openModal(id) { document.getElementById(id).classList.add("open"); }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }
    function closeModalOnBackdrop(e, id) {
      if (e.target.id === id) closeModal(id);
    }

    document.getElementById("examCode").addEventListener("change", buildExam);
    document.getElementById("shuffleQuestions").addEventListener("change", buildExam);
    document.getElementById("shuffleOptions").addEventListener("change", buildExam);
    document.getElementById("quizMode").addEventListener("change", resetCurrentExam);

    buildExam();
